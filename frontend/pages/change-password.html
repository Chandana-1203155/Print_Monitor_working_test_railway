<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecurePrint — Change Password</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-base); }
    .bg-grid { position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px); background-size: 40px 40px; }
    .bg-glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%); top: -200px; right: -100px; z-index: 0; pointer-events: none; }
    .auth-container { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow); }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="auth-container">
    <div class="auth-card">
      <h2 style="margin-bottom: 8px;">Change Password</h2>
      <p class="text-muted" style="margin-bottom: 24px;">Your password must be changed before continuing.</p>
      <form id="changeForm">
        <div id="message"></div>
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input type="password" id="currentPassword" class="form-control" placeholder="Enter current password" required />
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" id="newPassword" class="form-control" placeholder="Min 6 characters" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update Password</button>
      </form>
      <div class="auth-footer">
        <a onclick="Auth.logout()">Logout</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script>
    const user = Auth.requireAuth();
    if (!user) { Auth.logout(); }

    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const msg = document.getElementById('message');
      try {
        const res = await api.post('/auth/change-password', { currentPassword, newPassword });
        if (res.success) {
          msg.innerHTML = '<div class="alert alert-success">Password updated. Redirecting...</div>';
          setTimeout(() => {
            electronAPI.navigate(user.role === 'superadmin' ? 'super-admin' : user.role === 'admin' ? 'admin' : 'faculty');
          }, 1200);
        } else {
          msg.innerHTML = '<div class="alert alert-error">' + (res.message || 'Failed.') + '</div>';
        }
      } catch (e) {
        msg.innerHTML = '<div class="alert alert-error">Error updating password.</div>';
      }
    });
  </script>
</body>
</html>
