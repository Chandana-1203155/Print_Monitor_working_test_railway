<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecurePrint — Reset Secret Code</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-base); overflow: hidden; }
    .bg-grid { position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px); background-size: 40px 40px; }
    .bg-glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%); top: -200px; right: -100px; z-index: 0; pointer-events: none; }
    .auth-container { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow); }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="auth-container">
    <div class="auth-card">
      <h2 style="margin-bottom: 8px;">Reset Secret Code</h2>
      <p class="text-muted" style="margin-bottom: 24px;">Enter the one-time code from your email and set a new secret access code.</p>
      <form id="resetForm">
        <div id="message"></div>
        <div class="form-group">
          <label class="form-label">Reset Code</label>
          <input type="text" id="otp" class="form-control" placeholder="Enter 6-digit code" maxlength="6" required />
        </div>
        <div class="form-group">
          <label class="form-label">New Secret Code</label>
          <input type="password" id="newSecretCode" class="form-control" placeholder="Min 6 characters" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Reset Secret Code</button>
      </form>
      <div class="auth-footer">
        <a onclick="electronAPI.navigate('admin-portal')" style="cursor:pointer;">Back to Admin Portal</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = document.getElementById('otp').value.trim();
      const newSecretCode = document.getElementById('newSecretCode').value;
      const msg = document.getElementById('message');
      try {
        const res = await api.post('/auth/reset-secret', { otp, newSecretCode }, false);
        if (res.success) {
          msg.innerHTML = '<div class="alert alert-success">Secret code updated. Redirecting...</div>';
          setTimeout(() => { electronAPI.navigate('admin-portal'); }, 1500);
        } else {
          msg.innerHTML = '<div class="alert alert-error">' + (res.message || 'Reset failed.') + '</div>';
        }
      } catch (e) {
        msg.innerHTML = '<div class="alert alert-error">Error resetting secret code.</div>';
      }
    });
  </script>
</body>
</html>
