<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecurePrint — Reset Password</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-base); overflow: hidden; }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .bg-glow {
      position: fixed; width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
      top: -200px; right: -100px; z-index: 0; pointer-events: none;
    }
    .auth-container { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }
    .auth-logo { text-align: center; margin-bottom: 36px; }
    .auth-logo .logo-icon { width: 64px; height: 64px; background: linear-gradient(135deg, var(--accent), #6366f1); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; box-shadow: 0 8px 32px rgba(59,130,246,0.35); }
    .auth-logo h1 { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .auth-logo h1 span { color: var(--accent); }
    .auth-logo p { color: var(--text-muted); font-size: 13px; margin-top: 6px; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow), var(--shadow-accent); }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon">🖨️</div>
      <h1>Secure<span>Print</span></h1>
      <p>Reset Your Password</p>
    </div>

    <div class="auth-card">
      <form id="resetForm">
        <div id="message"></div>

        <div class="form-group">
          <label class="form-label" for="token">Reset Token</label>
          <input type="text" id="token" name="token" class="form-control" placeholder="Enter reset token" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Min 6 characters" minlength="6" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Update Password</button>
      </form>

      <div class="auth-footer">
        <a onclick="electronAPI.navigate('login')" style="cursor:pointer;">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tokenInput = document.getElementById('token');
    if (params.get('token')) tokenInput.value = params.get('token');

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = tokenInput.value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const msg = document.getElementById('message');

      try {
        const res = await api.post('/auth/reset-password', { token, newPassword }, false);
        if (res.success) {
          msg.innerHTML = '<div class="alert alert-success">Password updated. Redirecting to login...</div>';
          setTimeout(() => { electronAPI.navigate('login'); }, 1500);
        } else {
          msg.innerHTML = '<div class="alert alert-error">' + (res.message || 'Reset failed.') + '</div>';
        }
      } catch (error) {
        msg.innerHTML = '<div class="alert alert-error">Error resetting password.</div>';
      }
    });
  </script>
</body>
</html>
