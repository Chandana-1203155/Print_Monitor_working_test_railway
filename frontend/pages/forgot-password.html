<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecurePrint — Forgot Password</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-base); overflow: hidden; }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .bg-glow {
      position: fixed; width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
      top: -200px; right: -100px; z-index: 0; pointer-events: none;
    }

    .auth-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px; padding: 20px;
    }

    .auth-logo {
      text-align: center; margin-bottom: 36px;
    }
    .auth-logo .logo-icon {
      width: 64px; height: 64px; background: linear-gradient(135deg, var(--accent), #6366f1);
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; font-size: 28px; box-shadow: 0 8px 32px rgba(59,130,246,0.35);
    }
    .auth-logo h1 { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .auth-logo h1 span { color: var(--accent); }
    .auth-logo p { color: var(--text-muted); font-size: 13px; margin-top: 6px; }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px;
      box-shadow: var(--shadow), var(--shadow-accent);
    }

    .auth-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon">🖨️</div>
      <h1>Secure<span>Print</span></h1>
      <p>Forgot Password</p>
    </div>

    <div class="auth-card">
      <form id="forgotForm">
        <div id="message"></div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <div class="auth-footer">
        <a onclick="electronAPI.navigate('reset-password')" style="cursor:pointer;">Already have a reset link?</a><br>
        <a onclick="electronAPI.navigate('login')" style="cursor:pointer;">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('message');
      try {
        const res = await api.post('/auth/forgot-password', { email }, false);
        msg.innerHTML = '<div class="alert alert-success">If the email exists, a password reset link has been sent. Please check your inbox.</div>';
      } catch (error) {
        msg.innerHTML = '<div class="alert alert-error">Error sending request.</div>';
      }
    });
  </script>
</body>
</html>
